packages:
  - firmware.group
  - linux.group
  - system.group
  - network.group
  - build.group
  - locale.group
  - wayland.group
  - greeter.group
  - audio.group
  - graphics.group
  - mechanix.group
package_groups:
  - name: firmware
    packages:
      - initramfs-tools
      - u-boot-tools
  - name: linux
    packages:
      - linux-image-6.6.36+mecha+=6.6.36-g98f2850cc265-1
      - linux-headers-6.6.36+mecha+=6.6.36-g98f2850cc265-1
      - linux-libc-dev=6.6.36-g98f2850cc265-1
  - name: system
    packages:
      - dbus
      - nano
      - openssh-server
      - sudo
      - bash-completion
      - ca-certificates
      - dosfstools
      - upower
      - libglib2.0-0
      - glmark2-es2-wayland
      - gpiod
      - lsof
      - iw
      - udhcpc
      - kanshi
      - patchelf
      - libmpv-dev
      - pipewire
      - pipewire-alsa
      - pipewire-pulse
  - name: network
    packages:
      - bluez
      - hostapd
      - file
      - ethtool
      - network-manager
      - net-tools
      - curl
      - wget
      - unzip
  - name: build
    packages:
      - python3
  - name: graphics
    packages:
      - mesa-utils
  - name: locale
    packages:
      - systemd-timesyncd
      - locales
  - name: wayland
    packages:
      - xwayland
      - xorg
      - libwlroots12t64
      - labwc
      - sway
      - weston
  - name: greeter
    packages:
      - greetd
  - name: audio
    packages:
      - pulseaudio
      - mpg123
      - pulseaudio-module-bluetooth
      - alsa-tools
      - alsa-utils
      - libasound2
      - libasound2-plugins
  - name: web
    packages:
      - chromium
      - firefox-esr
  - name: mechanix
    packages:
      - mechanix-launcher
      - mechanix-keyboard
      - mechanix_desktop_dbus_server
      - mechanix_system_dbus_server
      - mechanix-files-beta
      - mechanix-notes-beta
      - mechanix-settings-beta
      - mechanix-music-beta
