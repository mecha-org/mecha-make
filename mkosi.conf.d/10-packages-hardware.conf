# Mecha Comet (imx8mp) hardware enablement

[Match]
Profiles=comet

[Content]
Packages=
    bluez
    bluez-obexd
    can-utils
    cpufrequtils
    evtest
    i2c-tools
    libcamera
    libcamera-devel
    libgpiod-utils
    linux-firmware-imx-sdma
    mesa-demos
    upower
    usbutils
    # SSH over USB
    dnsmasq
    # USB mode manager
    usb-signaller
    # Custom packages
    nxp-w61x-firmware
    kernel-core
    kernel-modules
    kernel-modules-core
    kernel-modules-extra
