[Distribution]
Distribution=fedora
Release=44

[Output]
Format=disk
Output=mechanix-os
SectorSize=512
CompressOutput=no
# Identifies this image as mechanix-os in /usr/lib/os-release (IMAGE_ID=)
# and to build scripts ($IMAGE_ID). Matches the CI workflow's IMAGE_PREFIX.
ImageId=mechanix-os

[Content]
Bootable=yes
Bootloader=systemd-boot
Autologin=yes
Hostname=comet

UnifiedKernelImages=no
KernelModulesInitrd=no
# Disable selinux for now, There is support for SELinuxRelabel in mkosi,
# but let's explore this at later point.
KernelCommandLine=selinux=0 quiet splash
# Disable mkosi-generated initrd
Initrds=
InitrdProfiles=plymouth
# No root login. Root is permanently locked - there is no override for this,
# by design (matches KDE Linux's approach). Administrative access is only
# via the 'mecha' sudo user, see mkosi.postinst.chroot / README.md.
RootPassword=hashed:!!
PostInstallationScripts=mkosi.postinst

# Packages are split by category into mkosi.conf.d/*.conf (merged together
# automatically by mkosi). See that directory for the full package list.

[Build]
# Incremental builds cache the package-install step; after editing
# mkosi.skeleton/ rebuild with -ff.
Incremental=yes
# Build-time tools (bootctl, mksquashfs, etc.) come from an isolated mkosi-
# managed tree instead of the host, so Bootloader=systemd-boot doesn't need
# a host-installed bootctl. Pinned to Fedora rather than mkosi's default (the
# host distribution, e.g. Debian/Ubuntu): a Debian tools tree pulls in dnf5,
# whose transaction ordering breaks %sysusers scriptlets (groupadd/useradd
# not found) when installing straight into a fresh Fedora --installroot.
# Fedora's own dnf5 build doesn't hit this.
ToolsTree=default
ToolsTreeDistribution=fedora
PackageCacheDirectory=mkosi.pkgcache
