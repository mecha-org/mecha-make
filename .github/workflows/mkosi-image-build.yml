name: Mechanix OS Image Build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: fedora:44
      options: --privileged

    env:
      MKOSI_OUTPUT: mechanix-os.raw
      IMAGE_PREFIX: mechanix-os

    steps:
      # 1. Checkout repo (instead of git clone)
      - name: Checkout mkosi-mecha
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install prerequisites
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          dnf -y update
          dnf -y install \
            mkosi \
            systemd \
            systemd-repart \
            git \
            python3 \
            wget \
            util-linux \
            e2fsprogs \
            dosfstools \
            squashfs-tools \
            xz \
            tar

      # 3. Cache DNF packages for the tool-install step below.
      - name: Cache DNF
        uses: actions/cache@v4
        with:
          path: /var/cache/dnf
          key: dnf-${{ runner.os }}-${{ hashFiles('mkosi.conf', 'mkosi.conf.d/**', 'mkosi.profiles/comet.conf') }}
          restore-keys: |
            dnf-${{ runner.os }}-

      # Cache the RPMs mkosi's dnf downloads (PackageCacheDirectory=mkosi.pkgcache).
      - name: Cache mkosi RPMs
        uses: actions/cache@v4
        with:
          path: mkosi.pkgcache
          key: mkosi-pkg-${{ runner.os }}-${{ hashFiles('mkosi.conf', 'mkosi.conf.d/**', 'mkosi.profiles/comet.conf') }}
          restore-keys: |
            mkosi-pkg-${{ runner.os }}-

      # 4. Configure the mecha user's password from a repo secret If CI_MECHA_USER_PASSWORD isn't configured, the build
      # falls back to the secure default: the mecha user ships locked.
      - name: Configure CI credentials
        env:
          CI_MECHA_USER_PASSWORD: ${{ secrets.CI_MECHA_USER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CI_MECHA_USER_PASSWORD}" ]; then
            printf 'MECHA_USER_PASSWORD=%s\n' "${CI_MECHA_USER_PASSWORD}" > mkosi.env
            chmod 600 mkosi.env
          fi

      # 5. Compute a single timestamp for this run, used as the image's
      # own IMAGE_VERSION (stamped into /etc/os-release)
      - name: Compute build version
        run: |
          echo "BUILD_VERSION=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      # 6. Build image
      - name: Build image with mkosi
        run: |
          set -euxo pipefail
          mkosi --profile=comet --image-version="${BUILD_VERSION}" \
            --environment=MECHA_COMMIT_SHA="${COMMIT_SHA}" -f build
          test -f "${MKOSI_OUTPUT}"

      # 7. Rename image and upload
      - name: Move image with timestamp
        run: |
          set -euxo pipefail

          FINAL_NAME="mechanix-os-${BUILD_VERSION}.raw"

          mkdir -p /opt/mecha
          mv "${MKOSI_OUTPUT}" /opt/mecha/${FINAL_NAME}

          echo "IMAGE_NAME=${FINAL_NAME}" >> $GITHUB_ENV

      - name: Upload mkosi image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: /opt/mecha/${{ env.IMAGE_NAME }}
